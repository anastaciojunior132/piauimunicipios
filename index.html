<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />

  <style>
    * {
      font-family: Arial, sans-serif !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;

    }

    #map {
      height: 100% !important;

      position: absolute;

    }

    .legend {
      background: white;
      line-height: 18px;

      padding: 12px;

      font-size: 14px;
      border-radius: 6px;
      max-height: 50vh;
      max-width: 300px;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }

    /* Responsivo para telas menores */
    @media (max-width: 600px) {
      .legend {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 90vw;
        max-height: 40vh;
        padding: 8px;

        z-index: 5000;

      /* Botão de recolher legenda */

        display: block;
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);

        color: white;

        padding: 5px 12px;

      margin-right: 8px;

    #downloadBtn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      z-index: 1000;
    }

    #uploadBtn {
      position: absolute;
      top: 80px;
      left: 10px;
      background: white;
      padding: 5px 10px;

      max-width: 480px;
      min-width: 250px;
      border: 1px solid #ccc;
      border-radius: 40px;
      font-size: 1.25rem;
    }

    /* Ajustes para telas pequenas */
    @media (max-width: 600px) {
      .map-title {
        position: relative;
        text-align: center;
        font-size: 16px;
        padding: 5px;
        margin-top: 5px;
      }

      #searchMunicipio {
        top: 60px;
        width: 80vw;
        padding: 0.5em 2em;
        font-size: 1rem;
      }
    }

    @media (max-width: 768px) {
      .map-title,
      .leaflet-control-search {
        width: 95% !important;
        max-width: none !important;
        margin: 10px auto;
        display: block;
      }

      .leaflet-control-layers {
        top: auto;
        bottom: 10px;
        right: 10px;
      }

      .legend {
        bottom: 60px;
        left: 10px;
      }
    }

    #listaMunicipios {
      position: absolute;
      top: calc(30px + 2.5em);
      left: 70%;
      transform: translateX(-50%);
      z-index: 4000;
      max-height: 200px;
      overflow-y: auto;
      width: 30vw;
      max-width: 480px;
      min-width: 250px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      display: none;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      #listaMunicipios {
        top: calc(60px + 2em);
        width: 80vw;
        max-width: none;
        min-width: auto;
      }
    }

    #listaMunicipios div {
      padding: 4px 8px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    #listaMunicipios div:hover { background-color: #ddd; }

    #coords {
      position: absolute;
      bottom: 50px;
      left: 10px;
      background: rgba(255, 255, 255, 0.5);
      padding: 5px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid rgba(204, 204, 204, 0.5);

    .map-title {

      top: 10px;
      left: 10%;

      background: rgba(255, 255, 255, 0.9);
      padding: 0.5em 1em;
      border-radius: 6px;
      font-size: 1.1rem;

      color: #333;

      z-index: 2000;

      max-width: 80vw;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .map-title {
        left: 50%;

    .rosa-sbg {

path.leaflet-interactive:focus {

    /* =========================
       SEU CÓDIGO EXISTENTE PARA TERRITÓRIOS, MUNICÍPIOS, ETC...
       ========================= */
const territorioPalette = [
  '#1f78b4', // Azul
  '#33a02c', // Verde médio
  '#e31a1c', // Vermelho
  '#ff7f00', // Laranja
  '#6a3d9a', // Roxo escuro
  '#b15928', // Marrom
  '#a6cee3', // Azul claro
  '#b2df8a', // Verde claro
  '#fb9a99', // Rosa claro
  '#fdbf6f', // Laranja claro
  '#cab2d6', // Lilás
  '#ffff99'  // Amarelo claro
];


    const territorioColors = [];
    let colorIndex = 0;

    function getColorForTerritorio(nome, codigo = null) {
  let terr = territorioColors.find(t => t.nome === nome);
  if (!terr) {
    const display = codigo ? `TD ${codigo} – ${nome}` : nome;
    terr = { nome, codigo, label: display, cor: territorioPalette[colorIndex % territorioPalette.length] };
    territorioColors.push(terr);
    colorIndex++;
  }
  return terr.cor;
}
function generateInfoContent(properties) { 
const labels = {
  NM_MUN: "Município:",
  CD_MUN: "Código do Município:",
  fid: "Código do Território:",
  NM_TD: "Território de Desenvolvimento:",
  AREA_KM2: "Área (km²):",
  "Aglomerado - PI": "Aglomerado:",   // <-- adicionado
  pib_porcent_Piaui: "PIB (%) Piauí:",
  pop_porcent_Piaui: "População (%) Piauí:",
  pib_porcent_TD: "PIB (%) TD:",
  pop_porcent_TD: "População (%) TD:",
  pib_2021: "PIB 2021:",
  pop_censo2022: "População (Censo 2022):",
  densidade_demografica: "Densidade demográfica:"
};

const grupos = {
  geografico: ["NM_MUN", "CD_MUN", "fid", "NM_TD", "AREA_KM2", "Aglomerado - PI"], // <-- adicionado
  populacional: ["pop_censo2022","densidade_demografica","pop_porcent_Piaui", "pop_porcent_TD"],
  pib: ["pib_2021","pib_porcent_Piaui", "pib_porcent_TD"]
};

  // Função para formatar número no formato pt-BR: 1234567.89 -> "1.234.567,89"
  function formatNumeroPTBR(numero, casasDecimais = 2) {
    return numero.toLocaleString('pt-BR', {
      minimumFractionDigits: casasDecimais,
      maximumFractionDigits: casasDecimais
    });
  }

  function formatValor(key, valor) {
  if (valor !== null && valor !== undefined) {
    let num = Number(valor);
    if (!isNaN(num)) {
      // Formata porcentagens com vírgula e % no final
      if (["pib_porcent_Piaui", "pop_porcent_Piaui", "pib_porcent_TD", "pop_porcent_TD"].includes(key)) {
        return num.toFixed(2).replace('.', ',') + "%";
      }
      // Campos inteiros (sem casas decimais e sem separador para código)
      if (key === "CD_MUN") {
        return String(Math.trunc(num)); // mantém só o número inteiro sem pontos
      }
      if (key === "pop_censo2022") {
        return num.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
      }
      // Para os demais numéricos, usa a formatação pt-BR com 2 casas
      return formatNumeroPTBR(num, 2);
    }
    return valor; // Não é número
  }
  return "-";
}
  let content = "";

  function montarTabelaGrupo(titulo, campos) {
    let html = `
      <div style="text-align: center; font-weight: bold; font-size: 1.1em; margin: 10px 0;">
        ${titulo}
      </div>
      <table class="popup-table" style="border-collapse: collapse; width: 100%; font-size: 0.95em;">
    `;
    campos.forEach(key => {
      if (key in properties) {
        const label = labels[key] || key;
        const valor = formatValor(key, properties[key]);
        html += `
          <tr>
            <th style="text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; font-weight: normal;">${label}</th>
            <td style="text-align: right; padding: 6px 8px; border-bottom: 1px solid #ddd;">${valor}</td>
          </tr>`;
      }
    });
    html += "</table>";
    return html;
  }

  content += montarTabelaGrupo("Informações Geográficas", grupos.geografico);
  content += montarTabelaGrupo("Informações Populacionais", grupos.populacional);
  content += montarTabelaGrupo("Informações de PIB", grupos.pib);

  return content;
}

    function onEachFeaturePopup(feature, layer) {
      if (feature.properties) {
        const popupContent = generateInfoContent(feature.properties) + 
          `<button class="download-btn" style="margin-top:5px;">Baixar KML desta feição</button>`;
        layer.bindPopup(popupContent);

        layer.on('popupopen', () => {
          const btn = document.querySelector('.download-btn');
          if (btn) {
            btn.onclick = () => {
              const kml = tokml({ type: "FeatureCollection", features: [feature] });
              const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = "feicao.kml";
              a.click();
              URL.revokeObjectURL(url);
            };
          }
        });
      }
    }

   function styleTerritorios(feature) {
  const nome = feature.properties.NM_TD || "Território";
  const codigo = feature.properties.fid || "";
  return {
    color: getColorForTerritorio(nome, codigo),
    weight: 2,
    fillColor: getColorForTerritorio(nome, codigo),
    fillOpacity: 0.4
  };
}
 let territorioSelecionado = null;

function highlightTerritory(nome) {
  territoriosLayer.eachLayer(layer => {
    if (!layer.feature) return;

    const nomeTerr = layer.feature.properties.NM_TD;
    const codigoTerr = layer.feature.properties.fid;

    if (nomeTerr === nome) {
      // Território selecionado → cor original mais forte
      const cor = getColorForTerritorio(nomeTerr, codigoTerr);
      layer.setStyle({
        color: cor,
        weight: 3,
        fillColor: cor,
        fillOpacity: 0.8 // mais forte
      });

      // Aproxima no território
      map.fitBounds(layer.getBounds());

    } else {
      // Outros territórios → cinza escuro
      layer.setStyle({
        color: "#222",       // cinza escuro borda
        weight: 1,
        fillColor: "#222",   // cinza escuro preenchimento
        fillOpacity: 0.8     // visível, mas apagado
      });
    }
    
  });

  // Garante que hover dos municípios continue funcionando
  municipiosLayer.eachLayer(mLayer => {
    mLayer.off("mouseover", highlightFeature);
    mLayer.off("mouseout", resetHighlight);

    mLayer.on({
      mouseover: highlightFeature,
      mouseout: resetHighlight
    });
  });



  // Marca na legenda
  document.querySelectorAll('.territorio-item').forEach(item => {
    if (item.getAttribute('data-nome') === nome) {
      item.style.fontWeight = "bold";
      item.style.color = "#000";
    } else {
      item.style.fontWeight = "normal";
      item.style.color = "";
    }
  });
}


function onEachTerritorio(feature, layer) {
  layer.on({
    mouseover: highlightFeature,
    mouseout: function (e) {
      territoriosLayer.resetStyle(e.target);
    },
    click: function () {
      const territorioNome = feature.properties?.NM_TD;
      const territorioCodigo = feature.properties?.fid;

      // Monta lista de municípios do território
      const municipios = [];
      municipiosLayer.eachLayer(mLayer => {
        const p = mLayer.feature?.properties || {};
        if ((p.NM_TD && territorioNome && p.NM_TD === territorioNome) || 
            (p.fid && territorioCodigo && p.fid === territorioCodigo)) {
          municipios.push(p.NM_MUN || "(sem nome)");
        }
      });

      // Ordena alfabeticamente
      municipios.sort((a, b) => a.localeCompare(b, 'pt-BR'));

      // Conteúdo base da popup
      const baseHtml = `<b>Território:</b> ${feature.properties?.NM_TD || "-"}<br>
<b>Código:</b> ${feature.properties?.fid || "-"}<br>
<button class="download-btn" style="margin-top:5px;">Baixar KML deste território</button>`;

      // Lista de municípios
      const listaHtml = municipios.length
        ? `<hr><b>Municípios (${municipios.length}):</b>
           <div style="max-height:150px;overflow:auto;margin-top:6px;">
             <ul style="margin:0;padding-left:18px;">
               ${municipios.map(n => `<li>${n}</li>`).join('')}
             </ul>
           </div>`
        : `<hr><i>Nenhum município associado encontrado.</i>`;

      // Adiciona popup
      layer.bindPopup(baseHtml + listaHtml);

      // Evento quando a popup abre
      layer.on('popupopen', (e) => {
        const popupEl = e.popup.getElement();
        const btn = popupEl.querySelector('.download-btn');
        if (btn) {
          btn.addEventListener('click', () => {
            // Nome do arquivo baseado no nome do território
            const nomeArquivo = (layer.feature.properties?.NM_TD || "territorio")
              .replace(/[^\w\s-]/g, "")
              .replace(/\s+/g, "_");

            // Gera o KML
            let kml = tokml({
              type: "FeatureCollection",
              features: [layer.feature]
            });

            // Estilo para bordas amarelas e preenchimento transparente
            const estiloKML = `
              <Style id="customStyle">
                <LineStyle>
                  <color>ff00ffff</color> <!-- Amarelo -->
                  <width>5</width>
                </LineStyle>
                <PolyStyle>
                  <color>00ffffff</color> <!-- Transparente -->
                  <fill>1</fill>
                  <outline>1</outline>
                </PolyStyle>
              </Style>
            `;

            // Insere estilo no KML e aplica no placemark
            kml = kml.replace("</Document>", `${estiloKML}</Document>`);
            kml = kml.replace(/<Placemark>/g, '<Placemark><styleUrl>#customStyle</styleUrl>');

            // Baixa o arquivo
            const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${nomeArquivo}.kml`;
            a.click();
            URL.revokeObjectURL(url);
          });
        }
      });

      // Abre a popup
      layer.openPopup();
    }
  });
}



const territoriosLayer = new L.GeoJSON.AJAX("territorios.geojson", {
  style: styleTerritorios,
  onEachFeature: onEachTerritorio
});

    territoriosLayer.on('data:loaded', addLegend);
    territoriosLayer.addTo(map);

    function styleMunicipios() {
      return { color: '#000', weight: 1.5, fillOpacity: 0 };
    }

   function highlightFeature(e) {
  const layer = e.target;
  layer.setStyle({ 
    weight: 4,             // aumentar a espessura da borda
    color: '#ff6600',      // cor laranja forte para a borda
    fillColor: '#ff6600',  // mesmo laranja para preenchimento
    fillOpacity: 0.5       // preenchimento semi-transparente
  });
  layer.bringToFront();
}
let municipioSelecionado = null;

function resetHighlight(e) {
  // Só reseta se NÃO for o município selecionado
  if (municipioSelecionado !== e.target) {
    municipiosLayer.resetStyle(e.target);
  }
}

function onEachMunicipio(feature, layer) {
  // Tooltip no hover
  const nome = feature.properties.NM_MUN || "Município desconhecido";
  layer.bindTooltip(
    `<b>${nome}</b><br><i>Clique para mais informações</i>`,
    { sticky: false, direction: 'top', opacity: 0.9 }
  );

  // Fecha tooltip quando abrir popup
  layer.on("popupopen", function () {
    layer.closeTooltip();
  });

  // Eventos de destaque visual no hover
  layer.on({
    mouseover: highlightFeature,
    mouseout: resetHighlight
  });

  // Evento de clique para manter cor até trocar
  layer.on("click", function () {
    // Se já havia um município selecionado, reseta o estilo dele
    if (municipioSelecionado && municipioSelecionado !== layer) {
      municipiosLayer.resetStyle(municipioSelecionado);
    }

    // Marca este como selecionado
    municipioSelecionado = layer;

    // Aplica estilo de destaque permanente
    layer.setStyle({
      weight: 4,
      color: '#ff6600',
      fillColor: '#ff6600',
      fillOpacity: 0.5
    });
  });

  // Bind da popup com informações + botão
  if (feature.properties) {
    layer.bindPopup(
      generateInfoContent(feature.properties) +
      `<button class="download-btn" style="margin-top:5px;">Baixar KML deste município</button>`
    );

    // Lógica do botão "Baixar KML"
    layer.on('popupopen', (e) => {
      const popupEl = e.popup.getElement();
      const btn = popupEl.querySelector('.download-btn');
      if (btn) {
        btn.addEventListener('click', () => {
          const nomeArquivo = (feature.properties?.NM_MUN || "municipio")
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/ç/g, "c").replace(/Ç/g, "C")
            .replace(/[^\w\s-]/g, "").replace(/\s+/g, "_");

          let kml = tokml({
            type: "FeatureCollection",
            features: [feature]
          });

          const estiloKML = `
            <Style id="customStyle">
              <LineStyle>
                <color>ff0000ff</color>
                <width>2</width>
              </LineStyle>
              <PolyStyle>
                <color>00ff0000</color>
                <fill>1</fill>
                <outline>1</outline>
              </PolyStyle>
            </Style>
          `;

          kml = kml.replace("</Document>", `${estiloKML}</Document>`);
          kml = kml.replace(/<Placemark>/g, '<Placemark><styleUrl>#customStyle</styleUrl>');

          const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${nomeArquivo}.kml`;
          a.click();
          URL.revokeObjectURL(url);
        });
      }
    });
  }

    /* ================== Busca Fuzzy =================== */
    const searchInput = document.getElementById('searchMunicipio');
    const listaMunicipios = document.getElementById('listaMunicipios');
    let highlightedIndex = -1;
    let currentResultados = [];

    function levenshtein(a, b) {
      const matrix = [];
      for(let i = 0; i <= b.length; i++){ matrix[i] = [i]; }
      for(let j = 0; j <= a.length; j++){ matrix[0][j] = j; }
      for(let i = 1; i <= b.length; i++){
        for(let j = 1; j <= a.length; j++){
          if(b.charAt(i-1) === a.charAt(j-1)){
            matrix[i][j] = matrix[i-1][j-1];
          } else {
            matrix[i][j] = Math.min(matrix[i-1][j-1] + 1,
              Math.min(matrix[i][j-1] + 1, matrix[i-1][j] +1));
          }
        }
      }
      return matrix[b.length][a.length];
    }

    searchInput.addEventListener('input', function () {
      const termo = this.value.trim().toLowerCase();
      listaMunicipios.innerHTML = '';
highlightedIndex = -1;
currentResultados = [];
      if (!termo) {
        listaMunicipios.style.display = 'none';
        return;
        
      }

      const resultados = [];

      municipiosLayer.eachLayer(layer => {
        const nomeMun = layer.feature.properties.NM_MUN;
        if (nomeMun) {
          const nomeLower = nomeMun.toLowerCase();
          if (nomeLower.includes(termo)) {
            resultados.push({ nome: nomeMun, layer });
          } else {
            const dist = levenshtein(termo, nomeLower);
            if (dist <= 3) {
              resultados.push({ nome: nomeMun, layer });
            }
          }
        }
      });

      if (resultados.length === 0) {
        listaMunicipios.style.display = 'none';
        return;
      }
resultados.sort((a, b) => a.nome.localeCompare(b.nome));
      resultados.forEach(item => {

    weight: 4,

    fillOpacity: 0.5
  });

  listaMunicipios.style.display = 'none';
  searchInput.value = item.nome;
});
        listaMunicipios.appendChild(div);
      });

      listaMunicipios.style.display = 'block';
    });
    searchInput.addEventListener('keydown', function(e) {

    e.preventDefault();
    if (highlightedIndex < itens.length - 1) {
      highlightedIndex++;

    }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (highlightedIndex > 0) {
      highlightedIndex--;
      updateHighlight(itens);
    }
  } else if (e.key === 'Enter') {
    if (highlightedIndex >= 0 && highlightedIndex < currentResultados.length) {
      itens[highlightedIndex].click();
    }
  }
});

function updateHighlight(itens) {
  itens.forEach((item, index) => {
    if (index === highlightedIndex) {
      item.classList.add('highlighted');
      item.scrollIntoView({ block: 'nearest' });
    } else {
      item.classList.remove('highlighted');
    }
  });
}

        let kml = tokml({
          type: "FeatureCollection",
          features: [feature]
        });

        // Estilo verde, transparente
        const estiloKML = `
          <Style id="litigioStyle">
            <LineStyle>
              <color>ff00ff00</color> <!-- Verde -->
              <width>3</width>
            </LineStyle>
            <PolyStyle>
              <color>00ffffff</color> <!-- Transparente -->
              <fill>1</fill>
              <outline>1</outline>
            </PolyStyle>
          </Style>
        `;

        // Insere estilo no KML
        kml = kml.replace("</Document>", `${estiloKML}</Document>`);
        kml = kml.replace(/<Placemark>/g, '<Placemark><styleUrl>#litigioStyle</styleUrl>');

        // Download
        const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "litigio.kml";
        a.click();
        URL.revokeObjectURL(url);
      };
    }
  });
}

    /* ========== Função Lat/Lon -> UTM ========== */
    function latLonToUTM(lat, lon) {
      const a = 6378137.0;
      const f = 1 / 298.257223563;
      const k0 = 0.9996;
      const e = Math.sqrt(f * (2 - f));

      const zone = Math.floor((lon + 180) / 6) + 1;
      const λ0 = (zone - 1) * 6 - 180 + 3;
      const λ0rad = λ0 * Math.PI / 180;

      const φ = lat * Math.PI / 180;
      const λ = lon * Math.PI / 180;

      const N = a / Math.sqrt(1 - e * e * Math.sin(φ) * Math.sin(φ));
      const T = Math.tan(φ) * Math.tan(φ);
      const C = (e * e / (1 - e * e)) * Math.cos(φ) * Math.cos(φ);
      const A = Math.cos(φ) * (λ - λ0rad);

      const M = a * (
        (1 - e * e / 4 - 3 * e ** 4 / 64 - 5 * e ** 6 / 256) * φ
        - (3 * e * e / 8 + 3 * e ** 4 / 32 + 45 * e ** 6 / 1024) * Math.sin(2 * φ)
        + (15 * e ** 4 / 256 + 45 * e ** 6 / 1024) * Math.sin(4 * φ)
        - (35 * e ** 6 / 3072) * Math.sin(6 * φ)
      );

      const x = k0 * N * (A + (1 - T + C) * A ** 3 / 6
        + (5 - 18 * T + T * T + 72 * C - 58 * (e * e / (1 - e * e))) * A ** 5 / 120) + 500000.0;

      let y = k0 * (M + N * Math.tan(φ) * (A ** 2 / 2 + (5 - T + 9 * C + 4 * C ** 2) * A ** 4 / 24
        + (61 - 58 * T + T * T + 600 * C - 330 * (e * e / (1 - e * e))) * A ** 6 / 720));

      if (lat < 0) y += 10000000.0;

      return { x, y, zone };
    }

    /* ===== Atualiza coordenadas ===== */
    const coordsDiv = document.getElementById('coords');
    map.on('mousemove', function (e) {
      const lat = e.latlng.lat.toFixed(5);
      const lon = e.latlng.lng.toFixed(5);
      const utm = latLonToUTM(e.latlng.lat, e.latlng.lng);
      coordsDiv.innerHTML = `Lat: ${lat}, Lon: ${lon}<br>E: ${utm.x.toFixed(2)}, N: ${utm.y.toFixed(2)}<br>Fuso: ${utm.zone}`;
    });

    /* ===== Upload de KML / KMZ ===== */  // <-- ADIÇÃO
    const uploadBtnEl = document.getElementById('uploadBtn');     // <-- ADIÇÃO
    const uploadInputEl = document.getElementById('uploadInput'); // <-- ADIÇÃO

    uploadBtnEl.addEventListener('click', () => {                 // <-- ADIÇÃO
      uploadInputEl.click();
    });                                                           // <-- ADIÇÃO

    uploadInputEl.addEventListener('change', async function(e) {  // <-- ADIÇÃO
      const files = Array.from(e.target.files);
      for (const file of files) {
        const name = file.name;
        try {
          if (name.toLowerCase().endsWith('.kml')) {
            const text = await file.text();
            addKMLTextToMap(text, name);
          } else if (name.toLowerCase().endsWith('.kmz')) {
            const arrayBuf = await file.arrayBuffer();
            const zip = await JSZip.loadAsync(arrayBuf);
            let kmlEntry = null;
            zip.forEach((relPath, zipEntry) => {
              if (!kmlEntry && relPath.toLowerCase().endsWith('.kml')) {
                kmlEntry = zipEntry;
              }
            });
            if (!kmlEntry) {
              alert('KMZ sem arquivo KML interno: ' + name);
              continue;
            }
            const kmlText = await kmlEntry.async('text');
            addKMLTextToMap(kmlText, name);
          } else {
            alert('Formato não suportado: ' + name);
          }
        } catch (err) {
          console.error(err);
          alert('Erro ao carregar ' + name + ': ' + err.message);
        }
      }
      // permite reenviar o mesmo arquivo depois
      uploadInputEl.value = '';
    });                                                           // <-- ADIÇÃO

    function addKMLTextToMap(kmlText, layerName) {                // <-- ADIÇÃO
      const kmlLayer = omnivore.kml.parse(kmlText);
      kmlLayer.addTo(map);
      if (layersControl) {
        layersControl.addOverlay(kmlLayer, layerName);
      }
      // tenta enquadrar
      try { map.fitBounds(kmlLayer.getBounds()); } catch(_) {}
    }                                                             // <-- ADIÇÃO

    function styleBiomas(feature) {
      const bioma = (feature.properties.Bioma || feature.properties.bioma || "").toLowerCase();
      switch (bioma) {
        case "amazônia": case "amazonia":
          return { color: "#1B5E20", fillColor: "#1B5E20", fillOpacity: 0.5, weight: 1 };
        case "caatinga":
          return { color: "#E6B800", fillColor: "#E6B800", fillOpacity: 0.5, weight: 1 };
        case "cerrado":
          return { color: "#4CAF50", fillColor: "#4CAF50", fillOpacity: 0.5, weight: 1 };
        case "mata atlântica": case "mata atlantica":
          return { color: "#00695C", fillColor: "#00695C", fillOpacity: 0.5, weight: 1 };
        case "pantanal":
          return { color: "#8D6E63", fillColor: "#8D6E63", fillOpacity: 0.5, weight: 1 };
        case "pampa":
          return { color: "#A1887F", fillColor: "#A1887F", fillOpacity: 0.5, weight: 1 };
        default:
          return { color: "#9E9E9E", fillColor: "#9E9E9E", fillOpacity: 0.5, weight: 1 };
      }
    }

      .then(r => r.json())
      .then(biomasData => {
        const biomasRecortados = { type: "FeatureCollection", features: [] };
