<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>GEO-PI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    * {
      font-family: Arial, sans-serif !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }

    #map {
      height: 100% !important;
      width: 100% !important;
      position: absolute;
      top: 0;
      left: 0;
    }

    .legend {
      background: white;
      line-height: 18px;
      color: #333;
      padding: 12px;
      overflow-y: auto;
      font-size: 14px;
      border-radius: 6px;
      max-height: 50vh;
      max-width: 300px;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }

    /* Responsivo para telas menores */
    @media (max-width: 600px) {
      .legend {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 90vw;
        max-height: 40vh;
        padding: 8px;
        font-size: 13px;
        z-index: 5000;
      }
      /* Botão de recolher legenda */
      .legend-toggle {
        display: block;
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: #007bff;
        color: white;
        border: none;
        padding: 5px 12px;
        border-radius: 4px;
        font-size: 14px;
        z-index: 6000;
        cursor: pointer;
      }
      /* Botão para expandir/recolher a pesquisa */
      .search-toggle {
        display: block;
        position: absolute;
        top: 30px;
        right: 10px;
        background: #007bff;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 1rem;
        z-index: 6000;
        cursor: pointer;
      }
      /* por padrão, esconda o input e a lista */
      #searchMunicipio,
      #listaMunicipios {
        display: none !important;
      }
    }

    .legend i {
      width: 58px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.7;
    }

    #downloadBtn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      z-index: 1000;
    }

    #uploadBtn {
      position: absolute;
      top: 80px;
      left: 10px;
      background: white;
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      z-index: 1000;
    }

    #uploadInput { display: none; }

    .north-arrow {
      pointer-events: none;
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/Map_symbol_north_arrow.svg/64px-Map_symbol_north_arrow.svg.png');
      background-size: contain;
      background-repeat: no-repeat;
      width: 40px;
      height: 40px;
      opacity: 0.8;
      margin-right: 10px;
      margin-top: 10px;
    }

    #searchMunicipio {
      position: absolute;
      top: 30px;
      left: 70%;
      transform: translateX(-50%);
      z-index: 3000;
      padding: 0.75em 3em;
      width: 30vw;
      max-width: 480px;
      min-width: 250px;
      border: 1px solid #ccc;
      border-radius: 40px;
      font-size: 1.25rem;
    }

    /* Ajustes para telas pequenas */
    @media (max-width: 600px) {
      .map-title {
        position: relative;
        text-align: center;
        font-size: 16px;
        padding: 5px;
        margin-top: 5px;
      }

      #searchMunicipio {
        top: 60px;
        width: 80vw;
        padding: 0.5em 2em;
        font-size: 1rem;
      }
    }

    @media (max-width: 768px) {
      .map-title,
      .leaflet-control-search {
        width: 95% !important;
        max-width: none !important;
        margin: 10px auto;
        display: block;
      }

      .leaflet-control-layers {
        top: auto;
        bottom: 10px;
        right: 10px;
      }

      .legend {
        bottom: 60px;
        left: 10px;
      }
    }

    #listaMunicipios {
      position: absolute;
      top: calc(30px + 2.5em);
      left: 70%;
      transform: translateX(-50%);
      z-index: 4000;
      max-height: 200px;
      overflow-y: auto;
      width: 30vw;
      max-width: 480px;
      min-width: 250px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      display: none;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      #listaMunicipios {
        top: calc(60px + 2em);
        width: 80vw;
        max-width: none;
        min-width: auto;
      }
    }

    #listaMunicipios div {
      padding: 4px 8px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    #listaMunicipios div:hover { background-color: #ddd; }

    #coords {
      position: absolute;
      bottom: 50px;
      left: 10px;
      background: rgba(255, 255, 255, 0.5);
      padding: 5px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid rgba(204, 204, 204, 0.5);
      z-index: 1000;
    }

    .map-title {
      position: absolute;
      top: 10px;
      left: 10%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      padding: 0.5em 1em;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #333;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
      z-index: 2000;
      text-align: center;
      max-width: 80vw;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .map-title {
        left: 50%;
        transform: translateX(-50%);
        font-size: 1rem;
        max-width: 95vw;
        white-space: normal;
        padding: 0.4em 0.8em;
      }
    }

    .leaflet-control-layers {
      margin-top: 0px !important;
    }

    .leaflet-control-zoom {
      margin-top: 150px !important;
      margin-left: 10px !important;
    }

    .rosa-sbg {
      pointer-events: none;
      margin-bottom: 60px;
      margin-left: 10px;
      background: transparent;
      width: 150px;
      height: 150px;
      transform: scale(0.6);
      transform-origin: center;
    }

    .territorio-item {
      cursor: pointer;
      transition: color 0.3s;
    }

    .territorio-item:hover {
      color: #007bff;
      font-weight: bold;
    }

    #searchMunicipio,
    #listaMunicipios {
      font-family: Arial, sans-serif;
    }

    #listaMunicipios div.highlighted {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <button class="legend-toggle" onclick="toggleLegend()">⮟ Legenda</button>
  <!-- Botão toggle para a pesquisa -->
  <button class="search-toggle" onclick="toggleSearch()">🔍 Buscar</button>

  <div class="map-title">Mapa Interativo – Territórios e Municípios</div>
  <div id="coords">Lat: -, Lon: -<br>E: -, N: -<br>Fuso: -</div>

  <button id="uploadBtn">Upload KML</button>
  <input type="file" id="uploadInput" accept=".kml,.kmz,.xml" multiple />
  
  <input type="text" id="searchMunicipio" placeholder="Pesquisar município" />
  <div id="listaMunicipios"></div>

  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-ajax/dist/leaflet.ajax.min.js"></script>
  <!-- JSZip para ler KMZ -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tokml@0.4.0/tokml.js"></script>
  <!-- leaflet-omnivore para ler KML/KMZ em Leaflet -->
  <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
  <script>
    const map = L.map('map').setView([-7, -42], 7.48);
    L.control.scale().addTo(map);

    const north = L.control({position: "topright"});
    north.onAdd = function(map) {
      const div = L.DomUtil.create("div", "north-arrow");
      return div;
    };
    north.addTo(map);

    // Camadas base
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    });
    const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri' });
    const esriTerrain = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri' });
    const esriRoad = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri' });
    osmLayer.addTo(map);

    /* =========================
       SEU CÓDIGO EXISTENTE PARA TERRITÓRIOS, MUNICÍPIOS, ETC...
       ========================= */
    const territorioPalette = [
      '#1f78b4', '#e31a1c', '#33a02c', '#ff7f00',
      '#6a3d9a', '#b15928', '#a6cee3', '#b2df8a',
      '#fb9a99', '#fdbf6f'
    ];
    const territorioColors = [];
    let colorIndex = 0;

    function getColorForTerritorio(nome, codigo = null) {
      let terr = territorioColors.find(t => t.nome === nome);
      if (!terr) {
        const display = codigo ? `TD ${codigo} – ${nome}` : nome;
        terr = { nome, codigo, label: display, cor: territorioPalette[colorIndex % territorioPalette.length] };
        territorioColors.push(terr);
        colorIndex++;
      }
      return terr.cor;
    }

    function generateInfoContent(properties) {
      const labels = {
        NM_MUN: "Município:",
        CD_MUN: "Código do Município:",
        fid: "Código do Território:",
        NM_TD: "Território de Desenvolvimento:",
        AREA_KM2: "Área (km²):",
        pib_porcent_Piaui: "PIB (%) Piauí:",
        pop_porcent_Piaui: "População (%) Piauí:",
        pib_porcent_TD: "PIB (%) TD:",
        pop_porcent_TD: "População (%) TD:",
        pib_2021: "PIB 2021:",
        pop_censo2022: "População (Censo 2022):",
        densidade_demografica: "Densidade demográfica:"
      };
      const grupos = {
        geografico: ["NM_MUN", "CD_MUN", "fid", "NM_TD", "AREA_KM2"],
        populacional: ["pop_censo2022","densidade_demografica","pop_porcent_Piaui", "pop_porcent_TD"],
        pib: ["pib_2021","pib_porcent_Piaui", "pib_porcent_TD"]
      };

      function formatNumeroPTBR(numero, casasDecimais = 2) {
        return numero.toLocaleString('pt-BR', {
          minimumFractionDigits: casasDecimais,
          maximumFractionDigits: casasDecimais
        });
      }

      function formatValor(key, valor) {
        if (valor !== null && valor !== undefined) {
          let num = Number(valor);
          if (!isNaN(num)) {
            if (["pib_porcent_Piaui", "pop_porcent_Piaui", "pib_porcent_TD", "pop_porcent_TD"].includes(key)) {
              return num.toFixed(2).replace('.', ',') + "%";
            }
            return formatNumeroPTBR(num, 2);
          }
          return valor;
        }
        return "-";
      }

      let content = "";

      function montarTabelaGrupo(titulo, campos) {
        let html = `
          <div style="text-align: center; font-weight: bold; font-size: 1.1em; margin: 10px 0;">
            ${titulo}
          </div>
          <table class="popup-table" style="border-collapse: collapse; width: 100%; font-size: 0.95em;">
        `;
        campos.forEach(key => {
          if (key in properties) {
            const label = labels[key] || key;
            const valor = formatValor(key, properties[key]);
            html += `
              <tr>
                <th style="text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; font-weight: normal;">${label}</th>
                <td style="text-align: right; padding: 6px 8px; border-bottom: 1px solid #ddd;">${valor}</td>
              </tr>`;
          }
        });
        html += "</table>";
        return html;
      }

      content += montarTabelaGrupo("Informações Geográficas", grupos.geografico);
      content += montarTabelaGrupo("Informações Populacionais", grupos.populacional);
      content += montarTabelaGrupo("Informações de PIB", grupos.pib);

      return content;
    }

    function onEachFeaturePopup(feature, layer) {
      if (feature.properties) {
        const popupContent = generateInfoContent(feature.properties) +
          `<button class="download-btn" style="margin-top:5px;">Baixar KML desta feição</button>`;
        layer.bindPopup(popupContent);
        layer.on('popupopen', () => {
          const btn = document.querySelector('.download-btn');
          if (btn) {
            btn.onclick = () => {
              const kml = tokml({ type: "FeatureCollection", features: [feature] });
              const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = "feicao.kml";
              a.click();
              URL.revokeObjectURL(url);
            };
          }
        });
      }
    }

    function styleTerritorios(feature) {
      const nome = feature.properties.NM_TD || "Território";
      const codigo = feature.properties.fid || "";
      return {
        color: getColorForTerritorio(nome, codigo),
        weight: 2,
        fillColor: getColorForTerritorio(nome, codigo),
        fillOpacity: 0.4
      };
    }

    function highlightTerritory(nome) {
      territoriosLayer.eachLayer(layer => {
        if (layer.feature && layer.feature.properties.NM_TD === nome) {
          map.fitBounds(layer.getBounds());
          layer.setStyle({ color: 'red', weight: 4, fillOpacity: 1 });
        } else {
          layer.setStyle({ color: '#888', fillColor: '#ccc', fillOpacity: 0 });
        }
      });
    }

    function onEachTerritorio(feature, layer) {
      layer.on({
        mouseover: highlightFeature,
        mouseout: e => territoriosLayer.resetStyle(e.target),
        click: () => {
          const territorioNome = feature.properties?.NM_TD;
          const territorioCodigo = feature.properties?.fid;
          const municipios = [];
          municipiosLayer.eachLayer(mLayer => {
            const p = mLayer.feature?.properties || {};
            if ((p.NM_TD && territorioNome && p.NM_TD === territorioNome) ||
                (p.fid && territorioCodigo && p.fid === territorioCodigo)) {
              municipios.push(p.NM_MUN || "(sem nome)");
            }
          });
          municipios.sort((a, b) => a.localeCompare(b, 'pt-BR'));
          const baseHtml = generateInfoContent(feature.properties) +
            `<button class="download-btn" style="margin-top:5px;">Baixar KML desta feição</button>`;
          const listaHtml = municipios.length
            ? `<hr><b>Municípios (${municipios.length}):</b>
               <div style="max-height:150px;overflow:auto;margin-top:6px;">
                 <ul style="margin:0;padding-left:18px;">
                   ${municipios.map(n => `<li>${n}</li>`).join('')}
                 </ul>
               </div>`
            : `<hr><i>Nenhum município associado encontrado.</i>`;
          layer.bindPopup(baseHtml + listaHtml);
          layer.openPopup();
        }
      });
      onEachFeaturePopup(feature, layer);
    }

    const territoriosLayer = new L.GeoJSON.AJAX("territorios.geojson", {
      style: styleTerritorios,
      onEachFeature: onEachTerritorio
    });
    territoriosLayer.on('data:loaded', addLegend);
    territoriosLayer.addTo(map);

    function styleMunicipios() {
      return { color: '#000', weight: 1.5, fillOpacity: 0 };
    }

    function highlightFeature(e) {
      const layer = e.target;
      layer.setStyle({ weight: 4, color: '#ff6600', fillColor: '#ff6600', fillOpacity: 0.5 });
      layer.bringToFront();
    }

    let municipioSelecionado = null;
    function resetHighlight(e) {
      municipiosLayer.resetStyle(e.target);
    }

    function onEachMunicipio(feature, layer) {
      layer.on({ mouseover: highlightFeature, mouseout: resetHighlight });
      if (feature.properties) {
        layer.bindPopup(generateInfoContent(feature.properties) +
          `<button class="download-btn" style="margin-top:5px;">Baixar KML desta feição</button>`);
        layer.on('popupopen', () => {
          const btn = document.querySelector('.download-btn');
          if (btn) {
            btn.onclick = () => {
              const kml = tokml({ type: "FeatureCollection", features: [feature] });
              const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = "feicao.kml";
              a.click();
              URL.revokeObjectURL(url);
            };
          }
        });
      }
    }

    const municipiosLayer = new L.GeoJSON.AJAX("municipios.geojson", {
      style: styleMunicipios,
      onEachFeature: onEachMunicipio
    });
    municipiosLayer.addTo(map);

    /* ================== Busca Fuzzy =================== */
    const searchInput = document.getElementById('searchMunicipio');
    const listaMunicipios = document.getElementById('listaMunicipios');
    let highlightedIndex = -1;
    let currentResultados = [];

    function levenshtein(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          matrix[i][j] = b.charAt(i-1) === a.charAt(j-1)
            ? matrix[i-1][j-1]
            : Math.min(matrix[i-1][j-1] + 1, matrix[i][j-1] + 1, matrix[i-1][j] + 1);
        }
      }
      return matrix[b.length][a.length];
    }

    searchInput.addEventListener('input', function () {
      const termo = this.value.trim().toLowerCase();
      listaMunicipios.innerHTML = '';
      highlightedIndex = -1;
      currentResultados = [];
      if (!termo) { listaMunicipios.style.display = 'none'; return; }

      const resultados = [];
      municipiosLayer.eachLayer(layer => {
        const nomeMun = layer.feature.properties.NM_MUN;
        if (nomeMun) {
          const lower = nomeMun.toLowerCase();
          if (lower.includes(termo) || levenshtein(termo, lower) <= 3) {
            resultados.push({ nome: nomeMun, layer });
          }
        }
      });

      if (resultados.length === 0) { listaMunicipios.style.display = 'none'; return; }

      resultados.sort((a, b) => a.nome.localeCompare(b.nome));
      resultados.forEach(item => {
        const div = document.createElement('div');
        div.textContent = item.nome;
        div.addEventListener('click', () => {
          map.fitBounds(item.layer.getBounds());
          item.layer.openPopup();
          if (municipioSelecionado) municipiosLayer.resetStyle(municipioSelecionado);
          item.layer.setStyle({ weight: 4, color: '#ff6600', fillColor: '#ff6600', fillOpacity: 0.5 });
          municipioSelecionado = item.layer;
          listaMunicipios.style.display = 'none';
          searchInput.value = item.nome;
        });
        listaMunicipios.appendChild(div);
      });
      listaMunicipios.style.display = 'block';
    });

    searchInput.addEventListener('keydown', function(e) {
      const itens = listaMunicipios.querySelectorAll('div');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (highlightedIndex < itens.length - 1) highlightedIndex++;
        updateHighlight(itens);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (highlightedIndex > 0) highlightedIndex--;
        updateHighlight(itens);
      } else if (e.key === 'Enter') {
        if (highlightedIndex >= 0 && highlightedIndex < itens.length) itens[highlightedIndex].click();
      }
    });

    function updateHighlight(itens) {
      itens.forEach((item, i) => {
        item.classList.toggle('highlighted', i === highlightedIndex);
        if (i === highlightedIndex) item.scrollIntoView({ block: 'nearest' });
      });
    }

    document.addEventListener('click', e => {
      if (!searchInput.contains(e.target) && !listaMunicipios.contains(e.target)) {
        listaMunicipios.style.display = 'none';
      }
    });

    searchInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        const termo = this.value.trim().toLowerCase();
        if (!termo) return;
        let achou = false;
        municipiosLayer.eachLayer(layer => {
          if (layer.feature.properties.NM_MUN.toLowerCase() === termo) {
            map.fitBounds(layer.getBounds());
            layer.openPopup();
            achou = true;
          }
        });
        if (!achou) alert('Município não encontrado!');
        listaMunicipios.style.display = 'none';
      }
    });

    function onEachLitigio(feature, layer) {
      layer.on({ mouseover: highlightFeature, mouseout: e => litigioLayer.resetStyle(e.target) });
      onEachFeaturePopup(feature, layer);
    }
    const litigioLayer = new L.GeoJSON.AJAX("litigio.geojson", {
      style: { color: 'red', weight: 2 },
      onEachFeature: onEachLitigio
    });

    function onEachImperial(feature, layer) {
      layer.on({ mouseover: highlightFeature, mouseout: e => linhaImperialLayer.resetStyle(e.target) });
      onEachFeaturePopup(feature, layer);
    }
    const linhaImperialLayer = new L.GeoJSON.AJAX("linha_imperial.geojson", {
      style: { color: 'blue', weight: 2, dashArray: '5,5' },
      onEachFeature: onEachImperial
    });

    linhaImperialLayer.addTo(map);
    litigioLayer.addTo(map);
    litigioLayer.on('data:loaded', () => litigioLayer.bringToFront());

    /* CONTROLE DE CAMADAS */
    const baseMaps = { "OpenStreetMap": osmLayer, "Esri Satélite": esriSat, "Esri Terrain": esriTerrain, "Esri Road": esriRoad };
    const overlayMaps = { "Territórios": territoriosLayer, "Municípios": municipiosLayer, "Litígio": litigioLayer, "Linha Imperial": linhaImperialLayer };
    const layersControl = L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

    function addLegend() {
      const legend = L.control({ position: 'bottomright' });
      legend.onAdd = () => {
        const div = L.DomUtil.create('div','legend');
        div.innerHTML = '<div style="text-align:center;font-weight:bold;margin-bottom:5px;">Territórios de Desenvolvimento</div>';
        territorioColors
          .sort((a,b)=>a.codigo - b.codigo)
          .forEach(t => {
            div.innerHTML += `
              <div class="territorio-item" data-nome="${t.nome}" style="display:flex;align-items:center;gap:6px;margin-bottom:6px;cursor:pointer;">
                <i style="background:${t.cor};width:24px;height:24px;display:inline-block;"></i>
                <span style="font-size:13px;">${t.label}</span>
              </div>`;
          });
        div.innerHTML += '<hr style="margin:5px 0;"><small>Coordenação de Cartografia e Análise Espacial<br>CCAE/CIET/SEPLAN</small>';
        return div;
      };
      legend.addTo(map);
      setTimeout(() => {
        document.querySelectorAll('.territorio-item').forEach(item => {
          item.addEventListener('click', () => highlightTerritory(item.getAttribute('data-nome')));
        });
      }, 300);
    }

    /* Lat/Lon -> UTM */
    function latLonToUTM(lat, lon) {
      const a=6378137.0, f=1/298.257223563, k0=0.9996;
      const e=Math.sqrt(f*(2-f));
      const zone=Math.floor((lon+180)/6)+1;
      const λ0=((zone-1)*6-180+3)*Math.PI/180;
      const φ=lat*Math.PI/180, λ=lon*Math.PI/180;
      const N=a/Math.sqrt(1-e*e*Math.sin(φ)**2), T=Math.tan(φ)**2;
      const C=(e*e/(1-e*e))*Math.cos(φ)**2, A=Math.cos(φ)*(λ-λ0);
      const M=a*((1-e*e/4-3*e**4/64-5*e**6/256)*φ
        -(3*e*e/8+3*e**4/32+45*e**6/1024)*Math.sin(2*φ)
        +(15*e**4/256+45*e**6/1024)*Math.sin(4*φ)
        -(35*e**6/3072)*Math.sin(6*φ));
      let x=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T**2+72*C-58*(e*e/(1-e*e)))*A**5/120)+500000;
      let y=k0*(M+N*Math.tan(φ)*(A**2/2+(5-T+9*C+4*C**2)*A**4/24+(61-58*T+T**2+600*C-330*(e*e/(1-e*e)))*A**6/720));
      if (lat<0) y+=10000000;
      return { x, y, zone };
    }

    map.on('mousemove', e => {
      const lat=e.latlng.lat.toFixed(5), lon=e.latlng.lng.toFixed(5);
      const utm=latLonToUTM(e.latlng.lat, e.latlng.lng);
      document.getElementById('coords').innerHTML =
        `Lat: ${lat}, Lon: ${lon}<br>E: ${utm.x.toFixed(2)}, N: ${utm.y.toFixed(2)}<br>Fuso: ${utm.zone}`;
    });

    /* Upload KML/KMZ */
    const uploadBtnEl=document.getElementById('uploadBtn'),
          uploadInputEl=document.getElementById('uploadInput');
    uploadBtnEl.addEventListener('click', () => uploadInputEl.click());
    uploadInputEl.addEventListener('change', async function(e) {
      const files=Array.from(e.target.files);
      for (const file of files) {
        try {
          if (file.name.toLowerCase().endsWith('.kml')) {
            addKMLTextToMap(await file.text(), file.name);
          } else if (file.name.toLowerCase().endsWith('.kmz')) {
            const zip=await JSZip.loadAsync(await file.arrayBuffer());
            const entry=Object.values(zip.files).find(z=>z.name.toLowerCase().endsWith('.kml'));
            if (!entry) { alert('KMZ sem KML: '+file.name); continue; }
            addKMLTextToMap(await entry.async('text'), file.name);
          } else alert('Formato não suportado: '+file.name);
        } catch(err) { console.error(err); alert('Erro ao carregar '+file.name+': '+err.message); }
      }
      uploadInputEl.value = '';
    });

    function addKMLTextToMap(kmlText, layerName) {
      const kmlLayer = omnivore.kml.parse(kmlText);
      kmlLayer.addTo(map);
      layersControl.addOverlay(kmlLayer, layerName);
      try { map.fitBounds(kmlLayer.getBounds()); } catch {}
    }

    /* Rosa dos Ventos SBG */
    const rosaSBG=L.control({ position:"bottomleft" });
    rosaSBG.onAdd=() => {
      const div=L.DomUtil.create("div","rosa-sbg");
      div.innerHTML=`
<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <polygon points="70,40 90,80 50,80" fill="black" />
  <text x="70" y="30" font-size="36" font-weight="bold" fill="black" stroke="black" stroke-width="1" text-anchor="middle" dominant-baseline="middle">N</text>
</svg>`;
      return div;
    };
    rosaSBG.addTo(map);
    map.on('movestart', ()=> territoriosLayer.resetStyle());

    /* União para máscara */
    Promise.all([
      new Promise(r=> territoriosLayer.on('data:loaded',r)),
      new Promise(r=> litigioLayer.on('data:loaded',r)),
      new Promise(r=> linhaImperialLayer.on('data:loaded',r))
    ]).then(() => {
      const all=[...territoriosLayer.toGeoJSON().features, ...litigioLayer.toGeoJSON().features, ...linhaImperialLayer.toGeoJSON().features];
      let merged=all[0];
      for (let i=1;i<all.length;i++) {
        try { merged=turf.union(merged, all[i]); } catch(e){ console.warn('Erro unir:',e); }
      }
      const estadoPiauiLayer=L.geoJSON(merged, {
        style:{ color:'yellow', weight:3, fillColor:'transparent', fillOpacity:0 },
        onEachFeature:(f,l)=>l.bindPopup("Estado do Piauí")
      }).addTo(map);
      estadoPiauiLayer.bringToBack();
      layersControl.addOverlay(estadoPiauiLayer,"Estado do Piauí");
      const worldBounds=turf.bboxPolygon([-90,-60,-25,15]);
      const mask=turf.difference(worldBounds, merged);
      L.geoJSON(mask,{ style:{ fillColor:'black', fillOpacity:0.5, color:'black', weight:0 }, interactive:false }).addTo(map);
    });

    // Funções de toggle
    function toggleLegend(){
      const legend=document.querySelector('.legend'),
            btn=document.querySelector('.legend-toggle');
      if (legend.style.display==='none'){
        legend.style.display='block'; btn.innerHTML='⮝ Legenda';
      } else {
        legend.style.display='none'; btn.innerHTML='⮟ Legenda';
      }
    }

    function toggleSearch(){
      const input=document.getElementById('searchMunicipio'),
            lista=document.getElementById('listaMunicipios'),
            btn=document.querySelector('.search-toggle');
      if (input.style.display==='block'){
        input.style.display='none'; lista.style.display='none';
        btn.textContent='🔍 Buscar';
      } else {
        input.style.display='block'; btn.textContent='✖ Fechar';
        input.focus();
      }
    }
  </script>
</body>
</html>
